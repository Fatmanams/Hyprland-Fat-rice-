name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n syntax check (AGENTS.md minimum)
        run: |
          set -euo pipefail
          for f in scripts/*.sh config/hypr/gpu-env.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: shellcheck (error severity)
        run: |
          set -euo pipefail
          shellcheck --severity=error scripts/*.sh config/hypr/gpu-env.sh

  json-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: jq parse check (strip deliberate // comment headers first)
        run: |
          set -euo pipefail
          for f in config/swaync/config.json config/wlogout/layout; do
            echo "jq $f"
            sed '/^\/\//d' "$f" | jq empty
          done
