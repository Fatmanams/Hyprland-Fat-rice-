# =============================================================================
# hypridle.conf  —  idle/lock/DPMS behavior.
# Simple, conservative defaults. All driven by hypridle (the official
# upstream idle daemon for hyprland). Don't remove these unless you know
# what you're replacing.
# =============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 min idle -> lock screen
listener {
    timeout = 300
    on-timeout = $lock_cmd
}

# 5 min 30s idle -> DPMS (monitors off)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 10 min idle -> suspend
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
