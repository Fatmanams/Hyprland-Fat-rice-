# =============================================================================
# hypridle.conf  —  idle/lock/DPMS behavior.
# Simple, conservative defaults. All driven by hypridle (the official
# upstream idle daemon for hyprland). Don't remove these unless you know
# what you're replacing.
# =============================================================================

general {
    # What "lock" means: start hyprlock unless it's already running.
    # Triggered by logind whenever the session gets locked (see the
    # loginctl lock-session commands below).
    lock_cmd = pidof hyprlock || hyprlock
    # Lock before suspend so the machine never wakes to an unlocked session.
    before_sleep_cmd = loginctl lock-session
    # Re-enable the displays on resume (the DPMS listener below turns
    # them off after 5m30s of idle).
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Timers, in ascending order. To change the ladder, keep the ordering
# lock < dpms-off < suspend and the 30s gaps so steps don't race.
# 5 min idle -> lock screen
# Per hypridle upstream (assets/example.conf), `lock_cmd` in general{} is an
# internal config keyword for sleep-inhibit detection, NOT a variable
# expanded in listeners. Listeners run their `on-timeout` value directly
# via /bin/sh -c, so `$lock_cmd` here would expand to empty (no env var
# by that name) and do nothing. The upstream pattern is to invoke
# `loginctl lock-session`, which triggers logind → the configured `lock_cmd`.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5 min 30s idle -> DPMS (monitors off)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 10 min idle -> suspend
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
