# =============================================================================
# MangoHud config — gaming overlay for gamemoderun/mangohud %command%
#
# Minimal + readable + supports Proton + native games. Settings
# documented inline; change values here and re-launch game (MangoHud
# reads this on each launch, no daemon).
#
# To turn off the HUD for a single session without editing:
#   MANGOHUD=0 Mangohud=0 your_game
# To force-enable system-wide:
#   MANGOHUD=1 %command%
# =============================================================================

# ---- What to display ----------------------------------------------------
fps
cpu_stats
cpu_temp
gpu_stats
gpu_temp
ram
vram
swap
battery
winesync
frame_timing
histogram
time

# ---- Layout / position --------------------------------------------------
position=top-left
horizontal=left
hud_no_margin=false
background_alpha=0.6
font_size=16
font_size_text=14

# ---- Performance -------------------------------------------------------
# vsync=1 caps to vsync (default on; turn off for benchmarking)
vsync=1
# gl_vsync=-1 lets the driver decide (NVIDIA/AMD/Intel)
gl_vsync=-1

# ---- Toggle / persistence ----------------------------------------------
# Toggle HUD with Right Shift during the game
toggle_hud=Right_Shift
# Reload this config with Right Ctrl
reload_cfg=Right_Control

# ---- Misc ---------------------------------------------------------------
# Don't make GPU load spike from MangoHud's own polling
media_player_disable=true
core_load=0
engine_version=0
vulkan_driver=0

# Shadows for legibility over busy games
text_outline=no
background=0x1a1e1e2e
